<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF7" />
    <title>Fudi POS</title>
    <script type="module" crossorigin src="/assets/index-DIsc4IsK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D7JKv4hJ.css">
  </head>
  <body>
    <!-- Esto se ve mientras carga el JavaScript y React lo reemplaza apenas
         monta. Antes acá no había nada, así que cualquier demora o error de
         arranque se veía como una pantalla en blanco sin ninguna explicación. -->
    <div id="root">
      <div id="arranque">
        <div id="arranque-baldosa">
          <svg id="arranque-marca" width="88" height="88" viewBox="0 0 100 100" fill="none" aria-hidden="true"><rect x="28.3" y="19" width="43.4" height="13.95" rx="6.98" fill="#fff"/><rect x="28.3" y="45.04" width="32.24" height="13.95" rx="6.98" fill="#fff"/><rect x="28.3" y="19" width="13.95" height="62" rx="6.98" fill="#fff"/><circle cx="64.03" cy="73.33" r="7.67" fill="#F59E0B"/></svg>
        </div>
        <div id="arranque-logo">Fudi</div>
        <div id="arranque-texto">Abriendo…</div>
        <div id="arranque-puntos" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>

    <style>
      /* La misma fuente que el resto de la app, declarada acá también para
         que la pantalla de arranque no se dibuje con la del sistema. */
      @font-face {
        font-family: 'Outfit';
        src: url('/fonts/Outfit-Variable.woff2') format('woff2');
        font-weight: 300 800;
        font-style: normal;
        font-display: swap;
      }

      /* Mismos colores y formas que el resto de la app. Va todo en línea
         a propósito: esto se pinta antes de que cargue el CSS del bundle. */
      #arranque {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fdfbf7;
        color: #1f2937;
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #arranque-baldosa {
        width: 88px;
        height: 88px;
        border-radius: 25px;
        background: #9b1b30;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 40px -15px rgba(155, 27, 48, 0.4);
      }
      #arranque-logo {
        margin-top: 28px;
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #arranque-texto {
        margin-top: 8px;
        color: #6b7280;
        font-size: 0.9rem;
        font-weight: 500;
        max-width: 16rem;
      }
      #arranque-puntos {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }
      #arranque-puntos i {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #f59e0b;
        animation: arranque-punto 1s ease-in-out infinite;
      }
      #arranque-puntos i:nth-child(2) { animation-delay: 0.16s; }
      #arranque-puntos i:nth-child(3) { animation-delay: 0.32s; }
      @keyframes arranque-punto {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
      #arranque-detalle {
        margin-top: 10px;
        max-width: 22rem;
        font-size: 0.78rem;
        color: #6b7280;
        opacity: 0.85;
        word-break: break-word;
        white-space: pre-wrap;
      }
      #arranque-boton {
        margin-top: 28px;
        min-height: 52px;
        padding: 0 32px;
        border: 0;
        border-radius: 16px;
        background: #f59e0b;
        color: #1f2937;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
      }
    </style>

    <script>
      // Red de seguridad de arranque. Si el bundle no llega a cargar, no lo
      // entiende este WebView, o React se cuelga antes de montar (por ejemplo
      // esperando a Firebase), sin esto la app se quedaba en blanco/cargando
      // para siempre y no había forma de saber por qué ni de reintentar.
      (function () {
        var yaMostrado = false;

        window.__fudiFalloArranque = function (detalle) {
          if (yaMostrado || window.__fudiMontada) return;
          yaMostrado = true;
          var cont = document.getElementById('arranque');
          if (!cont) return;
          var baldosa = cont.querySelector('#arranque-baldosa');
          cont.innerHTML =
            (baldosa ? baldosa.outerHTML : '') +
            '<div id="arranque-logo">Fudi</div>' +
            '<div id="arranque-texto">No se pudo abrir la app.</div>' +
            '<div id="arranque-detalle"></div>' +
            '<button id="arranque-boton">Reintentar</button>';
          cont.querySelector('#arranque-detalle').textContent = String(detalle || '');
          cont.querySelector('#arranque-boton').onclick = function () {
            window.location.reload();
          };
        };

        window.addEventListener('error', function (e) {
          // Los errores de recursos (una fuente, una imagen) no traen
          // mensaje y no son motivo para tapar la app.
          if (!e.message && !e.error) return;
          window.__fudiFalloArranque((e.error && e.error.stack) || e.message);
        });

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          window.__fudiFalloArranque((r && (r.stack || r.message)) || r);
        });

        // Si a los 15 segundos React todavía no montó (o montó pero se quedó
        // esperando algo como Firebase), algo se colgó.
        setTimeout(function () {
          if (!window.__fudiMontada) {
            window.__fudiFalloArranque('La app tardó demasiado en iniciar. Puede ser un problema de conexión.');
          }
        }, 15000);
      })();
    </script>

  </body>
</html>
